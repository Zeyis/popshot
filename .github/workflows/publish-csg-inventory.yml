name: Publish CSG Inventory
on:
  push:
    branches: [main]
    paths:
      - 'csg-inventory/**'
      - '.github/workflows/publish-csg-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('csg-inventory/index.html').read_text()
          assert '<script>' in s and '</script>' in s
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/csg-inventory-app.js').write_text(js)
          assert 'EiKO Inventory' in s and 'Voltec Inventory' in s
          assert 'packingPaper' in s and 'userPin' in s
          PY
          node --check /tmp/csg-inventory-app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload inventory website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./csg-inventory
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# retry deployment after enabling Pages
