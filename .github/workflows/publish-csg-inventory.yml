name: Publish CSG Inventory
on:
  push:
    branches: [main]
    paths:
      - 'csg-inventory/**'
      - '.github/workflows/publish-csg-inventory.yml'
      - '.github/scripts/test-bj.js'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('csg-inventory/index.html').read_text()
          assert '<script>' in s and '</script>' in s
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/csg-inventory-app.js').write_text(js)
          assert 'EiKO Inventory' in s and 'Voltec Inventory' in s
          assert 'packingPaper' in s and 'userPin' in s
          PY
          node --check /tmp/csg-inventory-app.js
          node --check csg-inventory/receiving-ocr.js
          node --check csg-inventory/receiving.js
          node .github/scripts/test-receiving.js
          node --check csg-inventory/bj.js
          node .github/scripts/test-bj.js
          node --check csg-inventory/bj-pdf.js
      - name: Test filled original Magic City Supply PDF
        run: |
          npm install --prefix /tmp/csg-pdf-test --no-save --no-audit --no-fund pdf-lib@1.17.1
          NODE_PATH=/tmp/csg-pdf-test/node_modules node .github/scripts/test-bj-original-pdf.js
      - name: Smoke test BJ ordering and official EiKO product search
        run: node .github/scripts/test-bj-services.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload inventory website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./csg-inventory
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# retry deployment after enabling Pages

