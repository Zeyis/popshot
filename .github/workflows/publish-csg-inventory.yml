name: Publish CSG Inventory
on:
  push:
    branches: [main]
    paths:
      - 'csg-inventory/**'
      - '.github/workflows/publish-csg-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload inventory website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./csg-inventory
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
