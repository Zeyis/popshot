<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSG · EiKO Inventory</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#1c2632;background:#f6f5ef}*{box-sizing:border-box}body{margin:0}header{background:#212b30;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}header small{display:block;color:#e5d66c}main{max-width:1250px;margin:auto;padding:22px}nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px}button{cursor:pointer;border:0;border-radius:8px;background:#d8d5b8;padding:10px 14px;font-weight:700;color:#243036}button:hover{filter:brightness(.95)}button.primary{background:#e6d11f}button.danger{background:#fae1dd;color:#8b2e2e}input,textarea,select{padding:11px;border:1px solid #c9cec9;border-radius:8px;font-size:16px;max-width:100%}input,textarea{width:100%}label{display:block;font-weight:700;margin:10px 0 5px}h1{font-size:24px}h2{font-size:19px}.panel{background:white;border:1px solid #dde2dd;border-radius:13px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000a}.muted{color:#5e6b6b;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:11px;border-bottom:1px solid #ecefeb;text-align:left}th{font-size:12px;color:#596566}tr:hover{background:#fafaf4}.count{font-size:25px;font-weight:800}.login{max-width:420px;margin:60px auto}.hidden{display:none!important}.hint{color:#5a6266;font-size:13px}.alert{background:#fff4c7;padding:12px;border-radius:8px;margin:12px 0;color:#483c09} .error{background:#ffe5e5;color:#8b2020}.status{padding:5px 9px;border-radius:30px;background:#e6f6e6}.small{font-size:12px} .chip{border:1px solid #b9b9b0;background:white;margin:3px}.formlist{display:grid;gap:8px}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0}.item input{max-width:95px}.item div{flex:1}textarea{min-height:70px}@media(max-width:650px){header{padding:13px}main{padding:12px}.grid,.two{grid-template-columns:1fr}td,th{padding:8px 6px;font-size:12px} .panel{padding:13px}button{padding:9px}}</style></head>
<body><header><div><strong>CAHABA SALES GROUP</strong><small>EiKO · Shared Warehouse Inventory</small></div><div id="who" class="small"></div></header>
<div id="gate" class="panel login"><h1>Staff sign in</h1><p class="hint">Select your name. On your first visit, create a 4-digit PIN.</p><div class="formlist" id="people"></div><div id="pinform" class="hidden"><button onclick="back()">← Back</button><h2 id="welcome"></h2><label>4-digit PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}" placeholder="••••"><div id="confirmbox" class="hidden"><label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><p><label style="font-weight:400"><input id="remember" type="checkbox" checked style="width:auto"> Remember me on this device</label></p><button class="primary" id="signin" onclick="signIn()">Continue →</button></div><div class="alert hidden" id="authmsg"></div></div>
<main id="app" class="hidden"><div class="row" style="justify-content:space-between"><nav><button onclick="tab('inventory')">Inventory</button><button onclick="tab('order')">Create Order</button><button onclick="tab('orders')">Orders</button><button onclick="tab('activity')">Activity Log</button></nav><button onclick="logout()">Switch user</button></div><div class="alert hidden" id="msg"></div><section id="inventory"><div class="grid"><div class="panel">Part numbers<div class="count" id="parts">0</div></div><div class="panel">Total units<div class="count" id="units">0</div></div><div class="panel">Low / out of stock<div class="count" id="low">0</div></div></div><div class="row"><input id="search" placeholder="Search part number or EiKO code" oninput="drawInventory()" style="flex:1"><button onclick="editPart()">+ Add Part</button><button onclick="refresh()">↻ Refresh</button></div><div class="panel tablewrap"><table><thead><tr><th>Part number</th><th>EiKO code</th><th>In stock</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="order" class="hidden"><h1>New Order</h1><div class="panel"><div class="two"><div><label>Customer / company</label><input id="customer"></div><div><label>Job name</label><input id="job"></div></div><div class="two"><div><label>Street address</label><input id="street"></div><div><label>City, state, ZIP</label><input id="city"></div></div><label>Notes</label><textarea id="notes"></textarea></div><div class="panel"><label>Find a part</label><input id="findpart" placeholder="Search a part or EiKO code" oninput="findParts()"><div id="matches"></div><h2>Order items</h2><div id="cart"></div><button class="primary" onclick="submitOrder()">Confirm Order & Deduct Stock</button></div></section>
<section id="orders" class="hidden"><h1>Orders</h1><div id="orderlist"></div></section>
<section id="activity" class="hidden"><h1>Activity Log</h1><div id="loglist"></div></section>
<section id="edit" class="hidden"><h1 id="edith">Part details</h1><div class="panel"><input type="hidden" id="editid"><label>Part number</label><input id="editpart"><label>EiKO ordering code</label><input id="editcode"><label>Quantity on hand (absolute count)</label><input id="editqty" type="number" min="0" step="1"><label>Low stock alert level</label><input id="editmin" type="number" min="0" value="5"><label>Description</label><textarea id="editdesc"></textarea><p class="row"><button class="primary" onclick="savePart()">Save changes</button><button onclick="tab('inventory')">Cancel</button></p></div></section></main>
<script>
let token=localStorage.getItem('csg_token')||sessionStorage.getItem('csg_token'),person='',chosen='',creating=false,version=0,data={items:[],orders:[]},activity=[],cart={};
const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,body={}){const r=await fetch('https://rqjjwtdswzljaeoxyorq.supabase.co/functions/v1/csg-inventory',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token,...body})});let x=await r.json();if(!r.ok)throw Object.assign(Error(x.error||'Request failed'),{conflict:x.conflict,status:r.status});return x}
function message(s,err=false,where='msg'){$(where).textContent=s;$(where).className='alert'+(err?' error':'')}
function alertError(e){message(e.message||String(e),true);if(e.conflict)refresh()}
async function startup(){
 try{const x=await call('employees');$('people').innerHTML=x.employees.map(u=>'<button onclick="choose(\''+u.name+'\','+u.registered+')">'+u.name+' · '+(u.registered?'Enter PIN':'Create PIN')+'</button>').join('')}catch(e){message(e.message,true,'authmsg')}
 if(token){try{await refresh();return}catch{token='';localStorage.removeItem('csg_token');sessionStorage.removeItem('csg_token')}}$('gate').classList.remove('hidden')
}
function choose(n,registered){chosen=n;creating=!registered;$('people').classList.add('hidden');$('pinform').classList.remove('hidden');$('welcome').textContent=(creating?'Create PIN for ':'Welcome back, ')+n;$('confirmbox').classList.toggle('hidden',!creating);$('signin').textContent=creating?'Create PIN & continue':'Unlock Inventory';$('pin').value='';$('pin2').value='';$('pin').focus()}
function back(){$('people').classList.remove('hidden');$('pinform').classList.add('hidden');$('authmsg').classList.add('hidden')}
async function signIn(){try{const pin=$('pin').value;if(!/^\d{4}$/.test(pin))throw Error('Enter four digits');if(creating&&pin!==$('pin2').value)throw Error('PINs do not match');const remember=$('remember').checked;const x=await call(creating?'register':'login',{name:chosen,pin,remember});token=x.token;if(remember)localStorage.setItem('csg_token',token);else sessionStorage.setItem('csg_token',token);await refresh()}catch(e){message(e.message,true,'authmsg')}}
async function refresh(){const x=await call('state');person=x.actor;version=x.version;data=x.content;activity=x.activity; $('gate').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=person+' · Online';draw(); }
async function logout(){try{await call('logout')}catch{}localStorage.removeItem('csg_token');sessionStorage.removeItem('csg_token');token='';person='';$('app').classList.add('hidden');$('gate').classList.remove('hidden');back();startup()}
function tab(t){for(const id of ['inventory','order','orders','activity','edit'])$(id).classList.toggle('hidden',id!==t);if(t==='inventory')drawInventory();if(t==='orders')drawOrders();if(t==='activity')drawActivity();if(t==='order'){findParts();drawCart()}}
function draw(){drawInventory();drawOrders();drawActivity();drawCart()}
function drawInventory(){const items=data.items||[],q=$('search').value.toLowerCase();$('parts').textContent=items.length;$('units').textContent=items.reduce((n,x)=>n+x.qty,0).toLocaleString();$('low').textContent=items.filter(x=>x.qty<=x.min).length;$('rows').innerHTML=items.filter(x=>(x.part+' '+x.code).toLowerCase().includes(q)).sort((a,b)=>a.part.localeCompare(b.part)).map(x=>'<tr><td>'+escapeHtml(x.part)+'</td><td>'+escapeHtml(x.code||'—')+'</td><td><strong>'+x.qty+'</strong></td><td><button onclick="editPart('+x.id+')">Edit / Count</button></td></tr>').join('')}
function editPart(id){let x=data.items.find(i=>i.id===id)||{id:0,part:'',code:'',qty:0,min:5,desc:''};$('editid').value=x.id;$('editpart').value=x.part;$('editcode').value=x.code;$('editqty').value=x.qty;$('editmin').value=x.min;$('editdesc').value=x.desc||'';$('edith').textContent=x.id?'Edit '+x.part:'Add new part';tab('edit')}
async function change(op,payload){const x=await call('change',{version,op,payload});version=x.version;data=x.content;message('Saved to shared inventory. Updated by '+person);draw();return x}
async function savePart(){try{await change('part',{id:Number($('editid').value),part:$('editpart').value,code:$('editcode').value,qty:Number($('editqty').value),min:Number($('editmin').value),desc:$('editdesc').value});tab('inventory')}catch(e){alertError(e)}}
function findParts(){let q=$('findpart').value.toLowerCase();$('matches').innerHTML=!q?'':data.items.filter(x=>(x.part+' '+x.code).toLowerCase().includes(q)).slice(0,12).map(x=>'<div class="item"><span>'+escapeHtml(x.part)+' · '+x.qty+' available</span><button onclick="addCart('+x.id+')">Add</button></div>').join('')}
function addCart(id){cart[id]=(cart[id]||0)+1;drawCart()}
function removeCart(id){delete cart[id];drawCart()}
function drawCart(){$('cart').innerHTML=Object.entries(cart).map(([id,qty])=>{const x=data.items.find(i=>i.id==id);return x?'<div class="item"><div>'+escapeHtml(x.part)+'<span class="muted"> · '+x.qty+' available</span></div><input type="number" min="1" value="'+qty+'" onchange="cart['+id+']=Number(this.value)"><button onclick="removeCart('+id+')">×</button></div>':''}).join('')||'<p class="muted">Search and add parts above.</p>'}
async function submitOrder(){try{const [city,statezip]=$('city').value.split(',').map(x=>x?.trim()||'');await change('order',{customer:$('customer').value,job:$('job').value,street:$('street').value,city, state:statezip,notes:$('notes').value,lines:Object.entries(cart).map(([id,qty])=>({id:Number(id),qty}))});cart={};for(const id of ['customer','job','street','city','notes','findpart'])$(id).value='';tab('orders')}catch(e){alertError(e)}}
function drawOrders(){$('orderlist').innerHTML=(data.orders||[]).map(o=>'<div class="panel"><div class="row" style="justify-content:space-between"><strong>'+escapeHtml(o.number)+'</strong><span class="status">'+escapeHtml(o.status||'confirmed')+'</span></div><p>'+escapeHtml(o.recipient)+' · '+escapeHtml(o.job||'')+'<br><small>'+escapeHtml(o.person)+' · '+new Date(o.created).toLocaleString()+'</small></p>'+o.lines.map(l=>'<div class="small">'+escapeHtml(l.part)+' · '+l.qty+'</div>').join('')+'<p><button onclick="printOrder(\''+o.id+'\')">Print Packing List</button> '+(o.status!=='cancelled'?'<button class="danger" onclick="cancelOrder(\''+o.id+'\')">Cancel & Restore Stock</button>':'')+'</p></div>').join('')||'<div class="panel">No orders yet.</div>'}
async function cancelOrder(id){if(!confirm('Cancel this order and return every item to stock?'))return;try{await change('cancel',{id});tab('orders')}catch(e){alertError(e)}}
function printOrder(id){let o=data.orders.find(x=>x.id===id);if(!o||o.status==='cancelled')return;let w=open('','_blank');if(!w){message('Allow popups to print',true);return}const rows=o.lines.map(x=>'<tr><td>'+escapeHtml(x.part)+'</td><td>'+escapeHtml(x.code)+'</td><td>'+x.qty+'</td></tr>').join('');w.document.write('<title>Packing List '+escapeHtml(o.number)+'</title><style>body{font:14px Arial;margin:35px}h1{margin-bottom:4px}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #aaa;padding:10px}</style><h2>CAHABA SALES GROUP</h2><h1>PACKING LIST</h1><p>'+escapeHtml(o.number)+' · '+new Date(o.created).toLocaleString()+'</p><p><b>SHIP TO:</b> '+escapeHtml(o.recipient)+'<br>'+escapeHtml(o.shipStreet)+'<br>'+escapeHtml(o.shipCity)+' '+escapeHtml(o.shipState)+'</p><p><b>JOB:</b> '+escapeHtml(o.job)+'<br><b>PULLED BY:</b> '+escapeHtml(o.person)+'</p><table><tr><th>Part</th><th>EiKO code</th><th>Qty</th></tr>'+rows+'</table><p>'+escapeHtml(o.notes||'')+'</p>');w.document.close();w.print()}
function drawActivity(){$('loglist').innerHTML=activity.map(x=>'<div class="panel"><strong>'+escapeHtml(x.actor)+'</strong> · '+escapeHtml(x.action)+'<div class="muted">'+new Date(x.at).toLocaleString()+'</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+escapeHtml(JSON.stringify(x.details,null,2))+'</pre></div>').join('')||'<div class="panel">No changes recorded yet.</div>'}
startup();setInterval(()=>{if(token&&!document.hidden&&$('edit').classList.contains('hidden'))refresh().catch(()=>{})},20000);
</script></body></html>
